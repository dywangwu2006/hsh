<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商场楼层导览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 32'%3E%3Cpath fill='%23C0392B' d='M12 1C7 1 3 5 3 10c0 6 9 14.5 9 14.5S21 16 21 10c0-5-4-9-9-9z'/%3E%3Ccircle cx='12' cy='10' r='3.4' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#EFE7D2; --panel:#FBF7EC; --ink:#3A2E1B; --soft:#6B5B3E;
    --line:#D9C9A3; --accent:#C0392B; --accent-dark:#96281B; --pin:#E74C3C;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  header{padding:14px 16px 8px;max-width:1000px;width:100%;margin:0 auto}
  header h1{font-size:19px;letter-spacing:1px}
  header p{font-size:13px;color:var(--soft);margin-top:4px}

  /* 楼层切换 */
  .floors{max-width:1000px;width:100%;margin:0 auto;padding:6px 16px;display:flex;gap:8px;flex-wrap:wrap}
  .floor-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 13px;font-size:14px;cursor:pointer}
  .floor-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}

  /* 搜索 */
  .search-bar{max-width:1000px;width:100%;margin:0 auto;padding:8px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .field{position:relative;flex:1 1 220px;min-width:0}
  .field input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:0 14px;font-size:16px;outline:none}
  .field input:focus{border-color:var(--accent)}
  .btn{height:46px;padding:0 18px;border:none;border-radius:var(--radius);cursor:pointer;background:var(--accent);color:#fff;font-size:15px;font-weight:600}
  .btn.ghost{background:#8A7A55}
  .status{flex:1 1 100%;font-size:14px;min-height:20px}
  .status.ok{color:var(--accent-dark);font-weight:600}
  .status.err{color:var(--accent)}

  /* 地图舞台: 静态按宽度铺满, 高度按图片比例自适应, 不挤压下方列表 */
  .map-wrap{max-width:1000px;width:100%;margin:0 auto;padding:0 16px 16px}
  .stage{position:relative;width:100%;border-radius:var(--radius);overflow:hidden;background:#E4D7B6;border:1px solid var(--line)}
  .stage-inner{position:relative;width:100%;aspect-ratio:1160/720}
  .canvas{position:relative;width:100%}
  .floor-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .floor-img[hidden]{display:none}

  /* 纯代码叠加方位标: 右上角, 半透明不遮挡铺位, 手机上缩小 */
  .compass{position:absolute;top:8px;right:8px;z-index:4;width:54px;padding:5px;border-radius:10px;background:rgba(251,247,236,.7);border:1px solid var(--line);text-align:center;pointer-events:none}
  .compass[hidden]{display:none}
  .compass svg{width:44px;height:44px;margin:0 auto;display:block}
  .compass .c-cap{display:none}
  .pin{position:absolute;width:34px;height:34px;margin:-34px 0 0 -17px;display:none;z-index:5;opacity:.85;transform:translate(-10px,-10px)}
  .pin.show{display:block;animation:pop .25s ease}
  @keyframes pop{from{transform:translate(-10px,-10px) scale(.6);opacity:0}to{transform:translate(-10px,-10px) scale(1);opacity:.85}}
  .pin svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
  .pin-label{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:var(--accent-dark);color:#fff;font-size:13px;font-weight:600;padding:3px 9px;border-radius:8px;white-space:nowrap;opacity:.85}

  .empty-map{position:absolute;inset:0;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--soft);font-size:15px;text-align:center;padding:20px}
  .empty-map .big{font-size:22px;font-weight:700;color:var(--ink)}

  /* 搜索结果列表 */
  .results{max-width:1000px;width:100%;margin:0 auto;padding:0 16px 28px}
  .results h2{font-size:15px;margin:6px 0 10px}
  .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;cursor:pointer;text-align:left}
  .chip .code{font-size:14px;font-weight:700;color:var(--ink)}
  .chip .name{font-size:13px;color:var(--soft);margin-top:3px;word-break:break-all}
  .chip.active{border-color:var(--accent);background:#FBEAE7}
  .chip.active .code{color:var(--accent-dark)}
  .none{font-size:14px;color:var(--soft);padding:8px 0}

  @media (max-width:480px){
    .chips{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<header>
  <h1>商场楼层导览</h1>
  <p>选择楼层，输入铺位编号或店名即可在地图上标记位置。</p>
</header>

<nav class="floors" id="floors"></nav>

<div class="search-bar">
  <div class="field">
    <input id="search" type="text" autocomplete="off" placeholder="编号或店名，如 111、烤匠" aria-label="编号或店名">
  </div>
  <button class="btn" id="locate">定位</button>
  <button class="btn ghost" id="reset">重置</button>
  <div class="status" id="status"></div>
</div>

<div class="map-wrap">
  <div class="stage" id="stage">
    <div class="stage-inner" id="stageInner">
      <div class="canvas" id="canvas">
        <img class="floor-img" data-floor="L6" src="assets/l6.png" alt="L6 平面图" hidden>
        <img class="floor-img" data-floor="L5" src="assets/l5.png" alt="L5 平面图" hidden>
        <img class="floor-img" data-floor="L4" src="assets/l4.png" alt="L4 平面图" hidden>
        <img class="floor-img" data-floor="L3" src="assets/l3.png" alt="L3 平面图" hidden>
        <img class="floor-img" data-floor="L2" src="assets/l2.png" alt="L2 平面图" hidden>
        <img class="floor-img" data-floor="L1" src="assets/l1.png" alt="L1 平面图" hidden>
        <img class="floor-img" data-floor="B1" src="assets/b1.png" alt="B1 商场平面图" hidden>
        <img class="floor-img" data-floor="B1BLOCK" src="assets/b1-block.png" alt="B1 街区平面图">
        <img class="floor-img" data-floor="B2" src="assets/b2.png" alt="B2 商场平面图" hidden>
        <img class="floor-img" data-floor="B2BLOCK" src="assets/b2block.png" alt="B2 街区平面图" hidden>
        <div class="compass" id="compass" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="44" fill="rgba(255,255,255,.35)" stroke="#D9C9A3" stroke-width="1.5"/>
            <polygon points="50,14 43,50 50,44 57,50" fill="#C0392B"/>
            <polygon points="50,86 43,50 50,56 57,50" fill="#8A7A55"/>
            <polygon points="14,50 50,43 44,50 50,57" fill="#8A7A55"/>
            <polygon points="86,50 50,43 56,50 50,57" fill="#8A7A55"/>
            <text x="50" y="13" text-anchor="middle" font-size="12" font-weight="700" fill="#96281B">北</text>
            <text x="50" y="96" text-anchor="middle" font-size="10" fill="#6B5B3E">南</text>
            <text x="12" y="54" text-anchor="middle" font-size="10" fill="#6B5B3E">西</text>
            <text x="88" y="54" text-anchor="middle" font-size="10" fill="#6B5B3E">东</text>
          </svg>
          <div class="c-cap">上北 <b>↑</b>　下南 <b>↓</b><br>左西 <b>←</b>　右东 <b>→</b></div>
        </div>
        <div class="pin" id="pin">
          <svg viewBox="0 0 24 32" aria-hidden="true">
            <path fill="#E74C3C" stroke="#fff" stroke-width="1.2" d="M12 1C7 1 3 5 3 10c0 6 9 14.5 9 14.5S21 16 21 10c0-5-4-9-9-9z"/>
            <circle cx="12" cy="10" r="3.4" fill="#fff"/>
          </svg>
          <div class="pin-label" id="pinLabel"></div>
        </div>
      </div>
    </div>
    <div class="empty-map" id="emptyMap" hidden>
      <div class="big" id="emptyTitle"></div>
      <div id="emptyNote"></div>
    </div>
  </div>
</div>

<section class="results">
  <h2 id="resultTitle">本层铺位</h2>
  <div class="chips" id="chips"></div>
</section>

const stage=document.getElementById("stage");
const imgs=[...document.querySelectorAll(".floor-img")];
const compass=document.getElementById("compass");
let img=null;
const pin=document.getElementById("pin");
const pinLabel=document.getElementById("pinLabel");
const statusEl=document.getElementById("status");
const input=document.getElementById("search");
const chips=document.getElementById("chips");
const emptyMap=document.getElementById("emptyMap");
const floorsNav=document.getElementById("floors");

let current=null;
let markers=[]; // 当前层点位列表(含别名展开)

function norm(s){return String(s==null?"":s).trim().toUpperCase().replace(/\s+/g,"")}

function renderFloors(){
  floorsNav.innerHTML="";
  FLOORS.forEach(f=>{
    const b=document.createElement("button");
    b.className="floor-btn"+(f.id===current.id?" active":"");
    b.textContent=f.name;
    b.addEventListener("click",()=>switchFloor(f.id));
    floorsNav.appendChild(b);
  });
}

// 地图静态铺满宽度, 高度由图片宽高比决定; 红点按百分比定位
function syncStageHeight(){
  const inner=document.getElementById("stageInner");
  if(!img||!img.naturalWidth){return}
  inner.style.aspectRatio=`${img.naturalWidth}/${img.naturalHeight}`;
}

function switchFloor(id){
  current=FLOORS.find(f=>f.id===id)||FLOORS[0];
  renderFloors();
  pin.classList.remove("show");
  statusEl.textContent=""; statusEl.className="status";
  input.value="";
  markers=[];
  imgs.forEach(im=>{
    const on=im.dataset.floor===current.id;
    im.hidden=!on;
    if(on) img=im;
  });
  if(current.map){
    emptyMap.hidden=true;
    compass.hidden=false;
    const inner=document.getElementById("stageInner");
    inner.style.aspectRatio="1160/720"; inner.style.height="";
    const fit=()=>{syncStageHeight(); buildMarkerList(); renderChips("");};
    if(img.complete&&img.naturalWidth){fit();}
    else{img.onload=fit; syncStageHeight();}
  }else{
    img=null;
    compass.hidden=true;
    document.getElementById("stageInner").style.height="280px";
    document.getElementById("stageInner").style.aspectRatio="auto";
    emptyMap.hidden=false;
    document.getElementById("emptyTitle").textContent=current.name;
    document.getElementById("emptyNote").textContent=current.note||"平面图待补";
    buildMarkerList(); renderChips("");
  }
}

// 合并主点位与别名为可搜索列表
function buildMarkerList(){
  markers=[];
  const pos=current.pos||{}, names=current.names||{}, alias=current.alias||{};
  Object.keys(pos).forEach(key=>{
    const rec={key, x:pos[key].x, y:pos[key].y, name:names[key]||"", aliases:[key]};
    markers.push(rec);
  });
  Object.keys(alias).forEach(a=>{
    const key=alias[a];
    const rec=markers.find(m=>m.key===key);
    if(rec && !rec.aliases.includes(a)) rec.aliases.push(a);
  });
}

function resolve(q){
  const n=norm(q);
  if(!n) return null;
  if(current.pos && current.pos[n]) return n;
  if(current.alias && current.alias[n] && current.pos[current.alias[n]]) return current.alias[n];
  // 店名模糊
  const hit=markers.find(m=>norm(m.name)===n);
  if(hit) return hit.key;
  return null;
}

function locate(q){
  if(!current.pos){statusEl.textContent="本层暂无平面图，暂不能地图定位";statusEl.className="status err";return;}
  const key=resolve(q);
  if(!key){
    statusEl.textContent="未找到该编号或店名，请核对后重试";
    statusEl.className="status err"; pin.classList.remove("show"); return;
  }
  const p=current.pos[key];
  const px=(p.x/img.naturalWidth)*100, py=(p.y/img.naturalHeight)*100;
  pin.style.left=px+"%"; pin.style.top=py+"%";
  pinLabel.textContent=key+(current.names&&current.names[key]?" · "+current.names[key]:"");
  pin.classList.add("show");
  statusEl.textContent="已定位到 "+key+(current.names&&current.names[key]?"（"+current.names[key]+"）":"");
  statusEl.className="status ok";
  // 定位只标红点, 不改变当前缩放/平移, 保持默认宽度适配
  [...chips.children].forEach(c=>c.classList.toggle("active",c.dataset.key===key));
}

function renderChips(filter){
  chips.innerHTML="";
  const f=norm(filter);
  const list=markers.filter(m=>{
    if(!f) return true;
    return norm(m.key).includes(f) || (m.name&&norm(m.name).includes(f)) || m.aliases.some(a=>norm(a).includes(f));
  });
  if(!list.length){chips.innerHTML='<div class="none">无匹配铺位</div>';return;}
  list.sort((a,b)=>parseInt(a.key)||9999 < (parseInt(b.key)||9999)?-1:1);
  list.forEach(m=>{
    const el=document.createElement("button");
    el.className="chip"; el.dataset.key=m.key;
    el.innerHTML=`<div class="code">${m.key}</div>`+(m.name?`<div class="name">${m.name}</div>`:"");
    el.addEventListener("click",()=>{input.value=m.name||m.key; locate(m.key);});
    chips.appendChild(el);
  });
}

document.getElementById("locate").addEventListener("click",()=>locate(input.value));
document.getElementById("reset").addEventListener("click",()=>{pin.classList.remove("show");statusEl.textContent="";statusEl.className="status";input.value="";renderChips("");});
input.addEventListener("input",()=>renderChips(input.value));
input.addEventListener("keydown",e=>{if(e.key==="Enter")locate(input.value);});

// URL: ?floor=B1BLOCK&id=111
(function(){
  const p=new URLSearchParams(location.search);
  const f=p.get("floor")||"B1BLOCK";
  switchFloor(f);
  const id=p.get("id"); if(id) setTimeout(()=>locate(id),150);
})();
</script>
